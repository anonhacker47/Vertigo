services:
  vertigo:
    image: ghcr.io/anonhacker47/vertigo:latest
    build: .
    container_name: vertigo
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    environment:
      BEHIND_PROXY: ${BEHIND_PROXY:-}
      DEMO_MODE: ${DEMO_MODE:-}
      METRON_API_TOKEN: ${METRON_API_TOKEN:-}
      TENRAI_SERVER_KEY: ${TENRAI_SERVER_KEY:-}
    ports:
      - "${VERTIGO_PORT:-6166}:6166"
    volumes:
      - ${VERTIGO_DATA:-./data}:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
